<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taş Kağıt Makas 🎮</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="container">
    <button class="theme-btn" id="themeBtn">🌙</button>
        <h1>Taş ✊ Kağıt ✋ Makas ✌️</h1>

        <div class="scoreboard">
            <div class="score">
                <span class="label">Sen</span>
                <span class="value" id="playerScore">0</span>
            </div>
            <div class="score">
                <span class="label">Berabere</span>
                <span class="value" id="drawScore">0</span>
            </div>
            <div class="score">
                <span class="label">Bilgisayar</span>
                <span class="value" id="cpuScore">0</span>
            </div>
        </div>

        <div class="arena">
            <div class="choice" id="playerChoice">❔</div>
            <div class="vs">VS</div>
            <div class="choice" id="cpuChoice">❔</div>
        </div>

        <div class="result" id="result">Seçimini yap!</div>

        <div class="buttons">
            <button class="choice-btn" data-choice="rock">✊</button>
            <button class="choice-btn" data-choice="paper">✋</button>
            <button class="choice-btn" data-choice="scissors">✌️</button>
        </div>

        <button class="reset-btn" id="resetBtn">🔄 Sıfırla</button>
    </div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
